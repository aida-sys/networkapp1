<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; }
    #kasirin-web-status {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-content: center;
      gap: 12px;
      padding: 24px;
      background: #101827;
      color: #e2e8f0;
      font: 16px/1.5 system-ui, sans-serif;
      text-align: center;
    }
    #kasirin-web-status[hidden] { display: none; }
    #kasirin-web-status strong { color: #62d8f0; font-size: 20px; }
    #kasirin-web-detail { max-width: 560px; color: #cbd5e1; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kasirin_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>kasirin_mobile</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="kasirin-web-status" role="status" aria-live="polite">
    <strong>Kasirin sedang dimuat...</strong>
    <span id="kasirin-web-detail">Mohon tunggu sebentar.</span>
  </div>
  <script>
    (() => {
      const panel = document.getElementById('kasirin-web-status');
      const detail = document.getElementById('kasirin-web-detail');
      let failed = false;

      const showError = (message) => {
        failed = true;
        detail.textContent = message;
        panel.hidden = false;
      };
      const hideWhenFlutterStarts = () => {
        if (document.querySelector('flt-glass-pane, flutter-view')) {
          panel.hidden = true;
          observer.disconnect();
        }
      };
      const observer = new MutationObserver(hideWhenFlutterStarts);
      observer.observe(document.documentElement, { childList: true, subtree: true });

      if (window.location.protocol === 'file:') {
        showError('Jangan buka index.html langsung. Jalankan build melalui server HTTP/HTTPS, misalnya: python -m http.server 8080 --directory build/web, lalu buka http://localhost:8080.');
      } else {
        window.setTimeout(() => {
          if (!failed && !document.querySelector('flt-glass-pane, flutter-view')) {
            showError('Flutter belum berhasil dimuat. Periksa Console browser untuk detail error, lalu pastikan seluruh file build web disajikan dari folder yang sama.');
          }
        }, 15000);
      }

      window.addEventListener('error', (event) => {
        if (event.message) showError(`Gagal memuat Flutter: ${event.message}`);
      });
      window.addEventListener('unhandledrejection', (event) => {
        showError(`Gagal memulai aplikasi: ${String(event.reason)}`);
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async onerror="document.getElementById('kasirin-web-status').hidden = false; document.getElementById('kasirin-web-detail').textContent = 'File flutter_bootstrap.js tidak ditemukan. Sajikan seluruh isi folder build/web melalui server HTTP/HTTPS.';"></script>
</body>
</html>
